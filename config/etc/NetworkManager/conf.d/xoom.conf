# NetworkManager no Motorola Xoom (Sxmo usa nmcli para o Wi-Fi)
[main]
# Sem polkit: qualquer usuário local pode controlar a rede. No tablet só
# existem root e xoom; para usar polkit, troque por auth-polkit=true e
# instale polkit + uma regra liberando o grupo netdev.
auth-polkit=false
dhcp=internal

[device]
wifi.backend=wpa_supplicant

[keyfile]
# usb0 é a rede com o PC (IP fixo, serviço rede-usb): fora do NetworkManager
unmanaged-devices=interface-name:usb0
