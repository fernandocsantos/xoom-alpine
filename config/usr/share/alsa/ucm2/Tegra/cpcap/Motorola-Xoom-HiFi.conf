# Use case Configuration for Motorola Xoom (MZ600)
#
# Device 0: CPCAP stereo DAC (HiFi) on I2S1.
# Device 1: CPCAP voice codec on I2S2, capture only. The hardware stream has
# two slots: slot 0 = MIC2 (not connected), slot 1 = MIC1 (internal or
# headset microphone, selected by "Right Capture Route").

Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "xoom_mic"
			Direction Capture
			Channels 1
			HWChannels 2
			HWChannelPos0 FL
			HWChannelPos1 FR
		}
	}
]

SectionVerb {
	EnableSequence [
		cset "name='HiFi Playback Volume' 15"
		cset "name='Mic1 Capture Volume' 20"
		cset "name='Left Capture Route' Off"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='Lineout Left Playback Route' HiFi"
		cset "name='Lineout Right Playback Route' HiFi"
		cset "name='Int Spk Switch' on"
	]

	DisableSequence [
		cset "name='Int Spk Switch' off"
		cset "name='Lineout Left Playback Route' Off"
		cset "name='Lineout Right Playback Route' Off"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackMixerElem "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Headset Left Playback Route' HiFi"
		cset "name='Headset Right Playback Route' HiFi"
		cset "name='Headphones Switch' on"
	]

	DisableSequence [
		cset "name='Headphones Switch' off"
		cset "name='Headset Left Playback Route' Off"
		cset "name='Headset Right Playback Route' Off"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackMixerElem "HiFi"
		JackControl "Headphones Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='Right Capture Route' Mic 1"
		cset "name='Int Mic Switch' on"
	]

	DisableSequence [
		cset "name='Int Mic Switch' off"
		cset "name='Right Capture Route' Off"
	]

	Value {
		CapturePriority 100
		CaptureMixerElem "Mic1"
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "xoom_mic"
		Direction Capture
		Device 1
		HWChannels 2
		Channels 1
		Channel0 1
		ChannelPos0 MONO
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='Right Capture Route' Headset Mic"
		cset "name='Headset Mic Switch' on"
	]

	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='Right Capture Route' Off"
	]

	Value {
		CapturePriority 50
		CaptureMixerElem "Mic1"
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "xoom_mic"
		Direction Capture
		Device 1
		HWChannels 2
		Channels 1
		Channel0 1
		ChannelPos0 MONO
	}
}
